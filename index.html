<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь групп</title>
<style>
:root{--ink:#24322c;--muted:#75847c;--line:#e6ece7;--green:#2d9b67;--red:#d65353;--cream:#f5f8f5;--white:#fff;--mint:#e9f5ed}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1120px;margin:0 auto;padding:36px 24px 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#dff1e5;color:#277a50;display:grid;place-items:center;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0;color:var(--muted);font-size:13px}.today{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;color:#53635a;font-size:13px}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,.9fr);gap:22px;align-items:start}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px #253d2b08}.calendar{padding:24px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.cal-head h2{font-size:20px;margin:0}.month-controls{display:flex;align-items:center;gap:9px}.month-label{font-weight:650;min-width:138px;text-align:center}.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:white;border-radius:10px;font-size:19px;color:#52645a;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.week{color:#94a098;font-size:12px;margin-bottom:8px}.day{height:43px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;position:relative}.day:hover{background:#f0f6f1}.day.dim{color:#c0c9c3}.day.today{outline:1px solid #9bc9a9}.day.selected{background:#317d53;color:white;font-weight:700}.day.has-data:not(.selected):after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#67b47e;bottom:4px;left:calc(50% - 2px)}.legend{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px}.right{padding:24px;min-height:390px}.panel-title{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:19px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#829087;font-weight:700}.panel-title h2{font-size:21px;margin:4px 0 0}.count{color:var(--muted);font-size:13px;margin-top:6px}.add-row{display:flex;gap:8px;margin-bottom:18px}.add-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;outline:none}.add-row input:focus{border-color:#8fbea0;box-shadow:0 0 0 3px #dff1e5}.add-btn{border:0;border-radius:11px;background:#317d53;color:white;padding:0 15px;font-weight:650;cursor:pointer}.list{display:grid;gap:9px}.group{border:1px solid var(--line);border-radius:14px;overflow:hidden}.group-head{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer}.group-head:hover{background:#fafcfb}.group-name{font-weight:650;flex:1}.group-count{font-size:12px;color:var(--muted)}.chevron{color:#829087;transition:transform .2s}.group.open .chevron{transform:rotate(90deg)}.delete{border:0;background:transparent;color:#a0aaa3;font-size:17px;cursor:pointer;padding:3px 6px}.delete:hover{color:var(--red)}.children{display:none;padding:0 12px 12px;border-top:1px solid #f0f3f0}.group.open .children{display:block}.child-add{display:flex;gap:7px;margin:10px 0}.child-add input{padding:9px 10px}.child-add .add-btn{padding:0 12px;font-size:13px}.child{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid #f2f4f2}.child:last-child{border-bottom:0}.child-name{flex:1;font-weight:550;transition:color .15s}.child-name.ok{color:#27834f}.child-name.no{color:#c44545}.stats{display:flex;gap:5px;margin-left:auto}.stat-cell{min-width:64px;padding:4px 7px;border:1px solid var(--line);border-radius:9px;text-align:center;background:#fafcfb;line-height:1.15}.stat-label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.stat-value{font-size:13px;font-weight:700;color:#53635a}.stat-cell.present .stat-value{color:#27834f}.stat-cell.absent .stat-value{color:#c44545}.mark{width:31px;height:30px;border:1px solid var(--line);border-radius:9px;background:white;cursor:pointer;font-weight:700;font-size:15px;color:#a2ada5}.mark.yes.active{background:#e3f4e9;color:#21834b;border-color:#a9d7b8}.mark.no.active{background:#fdeaea;color:#cc4949;border-color:#f0b5b5}.empty{border:1px dashed #dce5dd;border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted);font-size:13px}.empty .emoji{font-size:26px;margin-bottom:8px}.empty strong{display:block;color:#526158;font-size:14px;margin-bottom:4px}.hint{font-size:12px;color:#9aa59e;margin-top:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#26382e;color:white;padding:10px 15px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.app{padding:22px 14px 38px}.layout{grid-template-columns:1fr;gap:14px}.calendar,.right{padding:18px}.day{height:40px}.today{display:none}.top{margin-bottom:18px}.month-label{min-width:116px;font-size:14px}}
@media(max-width:520px){body{font-size:16px}.app{padding:16px 12px calc(28px + env(safe-area-inset-bottom))}.top{align-items:flex-start;margin-bottom:14px}.brand{gap:9px}.logo{width:38px;height:38px;border-radius:12px}.brand h1{font-size:18px}.brand p{font-size:12px;line-height:1.3;max-width:220px}.layout{gap:12px}.calendar,.right{padding:15px;border-radius:16px}.cal-head{margin-bottom:17px}.cal-head h2{font-size:18px}.month-controls{gap:5px}.month-label{min-width:118px;font-size:14px}.icon-btn{width:42px;height:42px;font-size:22px}.week,.days{gap:3px}.week{font-size:11px}.day{height:44px;border-radius:12px;font-size:15px;touch-action:manipulation}.legend{font-size:12px;line-height:1.4}.panel-title h2{font-size:19px}.add-row input{font-size:16px;padding:12px}.add-btn{min-height:44px;padding:0 13px;white-space:nowrap}.group-head{padding:13px 11px;min-height:50px}.group-count{font-size:11px}.child{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 30px;grid-template-areas:"name yes no delete" "stats stats stats stats";gap:8px;align-items:center;padding:11px 2px}.child-name{grid-area:name;overflow-wrap:anywhere}.child .mark.yes{grid-area:yes}.child .mark.no{grid-area:no}.child>.delete{grid-area:delete}.child .stats{grid-area:stats;justify-content:flex-end;margin:0}.mark{width:40px;height:40px;font-size:18px;touch-action:manipulation}.stat-cell{min-width:82px;padding:6px 9px}.stat-label{font-size:11px}.stat-value{font-size:15px}.child-add .add-btn{min-height:42px;padding:0 10px}.delete{font-size:20px}.empty{padding:22px 16px}}
@media(max-width:360px){.app{padding-left:9px;padding-right:9px}.calendar,.right{padding:12px}.month-label{min-width:104px}.day{height:41px}.child{grid-template-columns:minmax(0,1fr) 38px 38px 26px;gap:7px}.mark{width:38px;height:38px}.stat-cell{min-width:76px}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">▦</div><div><h1>Календарь групп</h1><p>Планируйте занятия и отмечайте посещаемость</p></div></div><div class="today" id="todayText"></div></header><div class="layout"><section class="card calendar"><div class="cal-head"><h2>Календарь</h2><div class="month-controls"><button class="icon-btn" id="prev" aria-label="Предыдущий месяц">‹</button><div class="month-label" id="monthLabel"></div><button class="icon-btn" id="next" aria-label="Следующий месяц">›</button></div></div><div class="week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days" id="days"></div><div class="legend">Нажмите на дату, чтобы открыть или создать группы. Точка означает, что на дату уже есть группы.</div></section><section class="card right"><div class="panel-title"><div><div class="eyebrow">Выбранная дата</div><h2 id="selectedDate"></h2><div class="count" id="groupCount"></div></div></div><form class="add-row" id="groupForm"><input id="groupInput" placeholder="Название новой группы" maxlength="60" autocomplete="off"><button class="add-btn">+ Группа</button></form><div id="groupList"></div></section></div></main><div class="toast" id="toast"></div>
<script>
const KEY='calendar-groups-v1';let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let view=new Date();view.setDate(1);let selected=new Date();const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const monthFmt=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'});const fullFmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',weekday:'long'});function save(){localStorage.setItem(KEY,JSON.stringify(store))}function dateData(){return store[key(selected)]||(store[key(selected)]=[])}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function renderCalendar(){ $('#monthLabel').textContent=monthFmt.format(view);const days=$('#days');days.innerHTML='';const first=new Date(view.getFullYear(),view.getMonth(),1);let offset=(first.getDay()+6)%7;const start=new Date(first);start.setDate(1-offset);for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.className='day'+(d.getMonth()!==view.getMonth()?' dim':'')+(key(d)===key(selected)?' selected':'')+(key(d)===key(new Date())?' today':'')+((store[key(d)]||[]).length?' has-data':'');b.textContent=d.getDate();b.onclick=()=>{selected=d;renderCalendar();renderPanel()};days.append(b)}}function monthlyStats(groupName,childName){const month=key(selected).slice(0,7);let visits=0,absences=0;for(const [date,groups] of Object.entries(store)){if(!date.startsWith(month))continue;for(const group of groups){if(group.name!==groupName)continue;for(const child of group.children||[]){if(child.name===childName){if(child.status==="yes")visits++;else if(child.status==="no")absences++}}}}return{visits,absences}}function renderPanel(){ $('#selectedDate').textContent=fullFmt.format(selected);$('#groupList').innerHTML='';const groups=store[key(selected)]||[];$('#groupCount').textContent=groups.length?`${groups.length} ${plural(groups.length,'группа','группы','групп')}`:'Добавьте группу для этой даты';if(!groups.length){$('#groupList').innerHTML='<div class="empty"><div class="emoji">👥</div><strong>Пока нет групп</strong>Добавьте первую группу, чтобы начать вести список детей.</div>';return}groups.forEach(g=>{const box=document.createElement('div');box.className='group';const head=document.createElement('div');head.className='group-head';head.innerHTML=`<span class="chevron">›</span><span class="group-name"></span><span class="group-count"></span><button class="delete" title="Удалить группу" aria-label="Удалить группу">×</button>`;head.querySelector('.group-name').textContent=g.name;head.querySelector('.group-count').textContent=`${g.children.length} ${plural(g.children.length,'ребёнок','ребёнка','детей')}`;head.querySelector('.delete').onclick=e=>{e.stopPropagation();if(confirm(`Удалить группу «${g.name}» и список детей?`)){const arr=dateData();store[key(selected)]=arr.filter(x=>x.id!==g.id);save();renderPanel();renderCalendar()}};head.onclick=()=>box.classList.toggle('open');const kids=document.createElement('div');kids.className='children';const form=document.createElement('form');form.className='add-row child-add';form.innerHTML='<input placeholder="Имя ребёнка" maxlength="60" autocomplete="off"><button class="add-btn">+ Добавить</button>';form.onsubmit=e=>{e.preventDefault();const input=form.querySelector('input'),name=input.value.trim();if(!name)return;g.children.push({id:crypto.randomUUID(),name,status:''});save();renderPanel();box.classList.add('open');toast('Ребёнок добавлен')};kids.append(form);if(g.children.length){const rows=document.createElement('div');g.children.forEach(child=>{const row=document.createElement('div');row.className='child';const name=document.createElement('span');name.className='child-name'+(child.status==='yes'?' ok':child.status==='no'?' no':'');name.textContent=child.name;const yes=document.createElement('button');yes.className='mark yes'+(child.status==='yes'?' active':'');yes.textContent='✓';yes.title='Отметить галочкой';const no=document.createElement('button');no.className='mark no'+(child.status==='no'?' active':'');no.textContent='×';no.title='Отметить крестиком';yes.onclick=()=>setStatus(child,'yes');no.onclick=()=>setStatus(child,'no');const del=document.createElement('button');del.className='delete';del.title='Удалить ребёнка';del.textContent='×';del.onclick=()=>{g.children=g.children.filter(c=>c.id!==child.id);save();renderPanel();toast('Ребёнок удалён')};const stats=monthlyStats(g.name,child.name);const statsBox=document.createElement('div');statsBox.className='stats';statsBox.title='Итоги за '+monthFmt.format(selected);statsBox.innerHTML='<div class="stat-cell present"><span class="stat-label">Посещения</span><span class="stat-value">'+stats.visits+'</span></div><div class="stat-cell absent"><span class="stat-label">Пропуски</span><span class="stat-value">'+stats.absences+'</span></div>';row.append(name,yes,no,statsBox,del);rows.append(row)});kids.append(rows)}box.append(head,kids);$('#groupList').append(box)})}function setStatus(child,status){child.status=child.status===status?'':status;save();renderPanel();const box=[...document.querySelectorAll('.group')].find(el=>el.querySelector('.group-name').textContent===dateData().find(g=>g.children.some(c=>c.id===child.id))?.name);if(box)box.classList.add('open')}function plural(n,a,b,c){const x=n%100,y=n%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c}$('#groupForm').onsubmit=e=>{e.preventDefault();const input=$('#groupInput'),name=input.value.trim();if(!name)return;const list=dateData();if(list.some(g=>g.name.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('Такая группа уже есть');return}list.push({id:crypto.randomUUID(),name,children:[]});save();input.value='';renderPanel();renderCalendar();toast('Группа добавлена')};$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};$('#todayText').textContent='Сегодня · '+new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date());renderCalendar();renderPanel();
</script></body></html>
